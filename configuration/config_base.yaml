# A 股网格交易系统配置文件 v1.6.0
# 静态配置文件 - 包含所有固定配置参数
# 动态状态请修改 config_state.json

# === 系统版本 ===
version: "1.6.0"

# === 运行模式 ===
# select: 选股模式 - 筛选适合网格交易的标的
# optimize: 优化模式 - 贝叶斯优化网格参数
# signal: 信号模式 - 生成次日交易计划
mode: select

# === 股票池配置 ===
# 示例股票列表 (可自行修改)
stocks:
  - "000333.SZ"
  - "000066.SZ"
  - "000651.SZ"
  - "000338.SZ"
  - "000425.SZ"
# === 网格交易基础参数 ===
grid:
  # 基础网格间距 (%) - 会被 ATR 动态调整
  base_spacing: 2.0
  # 初始仓位比例 (%)
  initial_position: 50
  # 每格买入金额 (元) - 小资金建议 3000-5000
  grid_amount: 3000
  # 最大网格层数 - 小资金建议 5 层
  max_grids: 5
  # ATR 周期 (用于动态调整)
  atr_period: 20
  # ATR 调整系数 (网格间距 = base_spacing * (ATR / close_price) * coef)
  atr_coef: 1.5

# === 风控参数 ===
risk:
  # 单只股票最大仓位 (%)
  max_position_per_stock: 20
  # 总仓位上限 (%)
  max_total_position: 80
  # 涨跌停阈值 (%) - 用于判断是否暂停交易
  limit_threshold: 9.8
  # 最小流动性 (日均成交额，单位：万元)
  min_turnover: 5000
  # 交易时间检查 (True=只在交易时段运行)
  check_trading_time: true

# === 回测与优化参数 ===
backtest:
  # 回测天数 (用于优化)
  days: 250
  # 样本外验证比例 (Walk-Forward)
  oos_ratio: 0.3
  # Optuna 优化试验次数
  n_trials: 50
  # 手续费率 (佣金万 1.5，最低 5 元)
  commission_rate: 0.00015
  # 印花税率 (卖出收取万 5)
  stamp_tax: 0.0005
  # 过户费率
  transfer_fee: 0.00002
  # 滑点率 (默认 0.1%，即千 1，可根据流动性调整)
  slippage_rate: 0.001

# === 路径配置 ===
paths:
  # 数据存储目录
  data_dir: "./data"
  # 输出文件目录
  output_dir: "./output"
  # 信号文件名
  signal_file: "signals.csv"
  # 日志文件名
  log_file: "log.txt"
  # 报告文件名
  report_file: "report.json"

# === 选股阈值 ===
selection:
  # Hurst 指数阈值 (< 0.5 表示均值回归)
  hurst_threshold: 0.5
  # 最小价格 (避免低价股)
  min_price: 5.0
  # 最大价格 (避免高价股)
  max_price: 500.0
  # 年化波动率阈值
  volatility_threshold: 0.8
  # 保存前 N 只最佳股票到配置文件 - 小资金建议 3-5 只
  save_top_n: 5
  # 选股时最大处理股票数量 (避免时间过长) - 小资金建议 50 只
  max_stocks_to_process: 50

# === 网络优化配置 (反反爬虫策略) ===
network:
  # 数据源优先级设置
  prefer_baostock: true          # 优先使用 Baostock (更稳定，对请求频率限制宽松)
  use_baostock_fallback: true     # 是否启用 Baostock 作为备用数据源
  aggressive_switch: true         # AkShare 一次失败即切换到 Baostock（快速失败）

  # 请求频率控制（每只股票之间的延迟）
  min_delay_per_stock: 3.0        # 最小延迟 (秒)
  max_delay_per_stock: 8.0        # 最大延迟 (秒)

  # 批次处理设置（模拟人类工作 - 休息节奏）
  batch_size: 5                   # 每批处理多少只股票（减小以更频繁休息）
  long_rest_after_batches: 3      # 每处理几批后长时间休息
  long_rest_duration: 30.0        # 长时间休息的时长 (秒)

  # 自适应冷却策略（新增）
  adaptive_cooldown_base: 30.0     # 基础冷却时间 (秒)
  adaptive_cooldown_multiplier: 2.0 # 失败时指数增长倍数
  max_cooldown: 300.0            # 最大冷却时间 (秒)
  recovery_factor: 0.8            # 成功后延迟减少因子

  # 重试策略
  max_retries: 3                  # 最大重试次数（减小以快速失败）
  base_retry_delay: 3.0           # 基础重试延迟 (秒)
  enable_jitter: true             # 是否启用随机抖动（避免规律性请求）

  # get_all_a_stocks 专用设置（新增）
  stock_list_delay: 10.0          # 获取股票列表前的基础延迟 (秒)
  stock_list_per_exchange_rest: 5.0 # 沪深交易所间休息时长 (秒)

  # 连续失败保护
  consecutive_failure_limit: 3    # 连续失败多少次后主动休息（减小）
  failure_rest_duration: 30.0     # 连续失败后休息时长 (秒)

  # User-Agent 和 Referer 轮换
  rotate_user_agent: true         # 是否轮换 User-Agent
  rotate_referer: true            # 是否轮换 Referer

  # 额外的人类行为模拟
  enable_random_extra_delay: true # 是否启用随机额外延迟
  extra_delay_probability: 0.15   # 触发额外延迟的概率 (15%)
  extra_delay_min: 5.0            # 额外延迟最小值 (秒)
  extra_delay_max: 20.0           # 额外延迟最大值 (秒)

# === 数据源配置 ===
data_sources:
  # AkShare 配置
  akshare:
    enabled: true
    timeout: 30                   # 请求超时时间 (秒)
    
  # Baostock 配置
  baostock:
    enabled: true
    auto_login: true              # 是否自动登录

# === 日志配置 ===
logging:
  # 日志级别
  level: INFO
  # 日志轮转：保留最近 30 天
  backup_count: 30
  # 单个日志文件最大大小 (MB)，0 表示不限制
  max_bytes: 0

# === 多因子打分配置 (新) ===
screening:
  # 因子权重 (绝对值和必须为 1.0)
  factor_weights:
    ou_half_life: -0.35    # OU半衰期: 负=偏好低值(快速均值回归)
    hurst: -0.30           # Hurst指数: 负=偏好低值(均值回归)
    adx: -0.20             # ADX: 负=偏好低值(趋势弱)
    volatility_fit: 0.15   # 波动率适配: 正=偏好中等值
  # 初筛条件
  initial_filters:
    min_turnover: 10000    # 万元 (1亿)
    min_price: 5.0
    max_price: 500.0
    max_stocks: 50        # 最多处理50只

# === 动态网格配置 (新) ===
dynamic_grid:
  # 波动率区间对应的 k 系数 (间距 = k * ATR)
  volatility_regime_k:
    low: 2.5      # 低波动 (<20%年化): k=2.5, 间距宽松
    medium: 2.0   # 中波动 (20-35%): k=2.0
    high: 1.5     # 高波动 (>35%): k=1.5, 间距紧密
  # 波动率阈值
  volatility_thresholds:
    low: 0.20     # 年化波动率 < 20% 为低波动
    high: 0.35    # 年化波动率 > 35% 为高波动
  # T+1 适配
  t1_min_spacing_coef: 1.5   # 最小间距 >= 1.5 * 日均振幅
  # 强制平仓
  force_close:
    grids_below: 3          # 价格跌破下轨3格触发
    close_pct: 0.50         # 平仓50%
  # 持仓限制
  position_limit_pct: 0.05  # 单股 <= 5% 总资本

# === 增强风控配置 (新) ===
risk_control:
  single_stock_loss_threshold: 0.15  # 单股亏损 >= 15% 熔断
  max_drawdown_threshold: 0.10       # 全局回撤 >= 10% 熔断
  max_position_per_stock: 0.30      # 单股持仓上限 30%（小资金适配）
  limit_threshold: 9.8               # 涨跌停阈值 9.8%

# === 滑点模型配置 (新) ===
slippage:
  base_rate: 0.001         # 基础滑点 0.1%
  price_tiers:
    high: [100, 0.0015]    # 价格>100: 0.15%
    medium: [20, 0.001]    # 价格20-100: 0.1%
    low: [0, 0.002]        # 价格<20: 0.2%

# === HTTP 请求配置 (新) ===
http:
  # 是否启用 Session 复用
  session_enabled: true
  # UA 更换间隔（秒），0 表示不更换
  ua_change_interval: 30
  # 连接池连接数
  pool_connections: 10
  # 连接池最大连接数
  pool_maxsize: 20

# === 错误恢复配置 (新) ===
error_recovery:
  # 连续失败多少次后刷新 Session
  session_refresh_after_failures: 3
  # 失败后是否降级使用缓存
  fallback_to_cache: true
  # 缓存过期天数（超过则不使用）
  cache_expire_days: 7

# === 高级多因子选股配置 ===
advanced_screening:
  # 双轨权重 (ETF vs 股票)
  weights:
    etf:
      F1: 0.35      # F1: OU半衰期 (均值回归速度，越短越好)
      F2: 0.15       # F2: ADX (趋势强度，越低越好)
      F3: 0.30          # F3: 波动质量 (倒U型，0.25最优)
      F4: 0.20          # F4: Path_Memory (方差比，越小越好)
    stock:
      F1: 0.25      # F1: OU半衰期
      F2: 0.35       # F2: ADX
      F3: 0.20          # F3: 波动质量
      F4: 0.20          # F4: Path_Memory

  # 质量阈值
  quality_threshold: 0.65
  threshold_mode: "adaptive_quantile"  # fixed | adaptive_quantile
  adaptive_quantile: 0.75              # 仅当 mode=adaptive_quantile 生效
  threshold_soft_cap: 0.82              # 阈值软上限，保证牛市候选池

  # 现金缓冲比例（当 Score < threshold 时）
  cash_buffer_ratio: 0.50

  # 行业分散约束（仅对股票生效）
  concentration_limits:
    max_per_industry: 3         # 单一申万一级行业最多N只

  # Path_Memory (Variance Ratio) 参数
  path_memory:
    variance_ratio_q: 5        # q=5 对齐网格触发频率(3-10日)
    min_periods: 120           # 最小样本数（~半年）

  # 波动质量参数 (倒U型函数)
  vol_quality:
    optimal_vol: 0.25          # 最优波动率
    tolerance: 0.15            # 容差范围

  # 网格参数映射（基于评分）
  grid_params:
    high_score:                # >= 0.80
      spacing_coef: 1.8
      position_pct: 0.025
    medium_score:              # 0.65 ~ 0.80
      spacing_coef: 2.2
      position_pct: 0.018
    low_score:                 # < 0.65
      spacing_coef: null
      position_pct: 0

# === 交易日历配置 (新增) ===
trading_calendar:
  cache_days: 7              # 日历缓存天数
  verify_on_load: true       # 是否在加载数据时校验交易日对齐
  cross_validate: true       # 是否启用多数据源交叉校验
  warn_on_mismatch: true     # 日历不一致时是否记录警告

# === 资产类型判断 ===
asset_classification:
  etf_regex: "^(51|56|58|15|16)\\d{4}\\.(SH|SZ)$"

# === 小资金配置（<10万）===
small_capital:
  enabled: true
  capital: 50000                    # 资金量（元）
  grid_amount: 3000                 # 每格金额
  max_grids: 5                      # 最大层数
  max_position_per_stock: 0.30      # 单股最大仓位 30%
  save_top_n: 3                     # 只选 3 只备选
  parallel_workers: 3                # 并行线程数

# === 预过滤配置（新增）===
pre_filter:
  enabled: true                      # 是否启用预过滤
  min_turnover: 50000               # 成交额门槛（万元），5亿以上
  max_price: 100.0                  # 最大价格（匹配 grid_amount/100）
  use_batch_info: true              # 使用批量行情接口（更快）
  parallel_workers: 3               # 预过滤并行线程数

